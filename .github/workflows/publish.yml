name: Publish
# https://github.com/ko-build/setup-ko?tab=readme-ov-file#example-usagejobs:

on:
  push:
    tags: ['v*']
  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
   steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - uses: ko-build/setup-ko@v0.8
      - run: ko build
